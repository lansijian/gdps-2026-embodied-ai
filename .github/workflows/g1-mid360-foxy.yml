name: G1 MID360 Foxy dry-run
on:
  push:
    branches: [codex/g1-mid360-foxy-dryrun-20261020]
  pull_request:
    paths: ['g1_mid360_foxy_ws/**', '.github/workflows/g1-mid360-foxy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pull-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const head = 'codex/g1-mid360-foxy-dryrun-20261020';
            const existing = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, state: 'open'});
            if (existing.data.length) { core.notice(existing.data[0].html_url); return; }
            const pr = await github.rest.pulls.create({owner, repo, head, base: 'main', draft: true,
              title: 'feat(g1): Foxy MID-360 dry-run navigation with calibration and clock gates',
              body: 'Adds an isolated ROS 2 Foxy colcon workspace for factory MID-360, measured TF/time gates, official pointcloud_to_laserscan, SLAM Toolbox/AMCL and Navfn/DWB. LIVE is disabled: no SDK write transport or FSM transitions are installed. Existing robot services and original dirty worktree are preserved.\n\nLocal contract tests passed; the dedicated Foxy container workflow exercises the ROS chain with explicitly labelled synthetic data. See g1_mid360_foxy_ws/docs/VERIFICATION_REPORT.md for final evidence and limitations. ARM64, calibration, real sensor time, real mapping/planning and all hardware acceptance remain ROBOT_VERIFICATION_PENDING.\n\nThis PR must not be interpreted as authorization for motion or merged as a hardware-ready release.'});
            core.notice(pr.data.html_url);
  foxy:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    container: ros:foxy-ros-base-focal
    env:
      ROS_DOMAIN_ID: '87'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      G1_NAV_TEST_ONLY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Foxy test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pytest python3-yaml python3-colcon-common-extensions ros-foxy-rmw-cyclonedds-cpp ros-foxy-navigation2 ros-foxy-nav2-bringup ros-foxy-slam-toolbox ros-foxy-pointcloud-to-laserscan ros-foxy-diagnostic-msgs
      - name: Contract tests and colcon build on Python 3.8
        run: |
          source /opt/ros/foxy/setup.bash
          cd g1_mid360_foxy_ws
          mkdir -p logs
          python3 -m pytest tests/test_contracts.py -q --junitxml=logs/contracts.xml
          colcon list --base-paths src
          colcon build --base-paths src --executor sequential --event-handlers console_direct+
          source install/setup.bash
          for mode in sensor_check mapping localization navigation_dryrun g1_nav_bringup; do
            ros2 launch g1_nav_bringup "$mode.launch.py" --show-args
          done
          dpkg-query -W 'ros-foxy-*' > logs/foxy-versions.txt
      - name: ROS sensor SLAM localization Nav2 fault-injection integration
        run: |
          source /opt/ros/foxy/setup.bash
          cd g1_mid360_foxy_ws
          source install/setup.bash
          python3 tests/ros_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxy-synthetic-evidence
          path: |
            g1_mid360_foxy_ws/logs/
            g1_mid360_foxy_ws/log/
