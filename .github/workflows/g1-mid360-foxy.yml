name: G1 MID360 Foxy dry-run
on:
  push:
    branches: [codex/g1-mid360-foxy-dryrun-20261020]
    paths:
      - 'g1_mid360_foxy_ws/src/**'
      - 'g1_mid360_foxy_ws/scripts/**'
      - 'g1_mid360_foxy_ws/tests/**'
      - 'g1_mid360_foxy_ws/third_party.lock'
      - '.github/workflows/g1-mid360-foxy.yml'
  pull_request:
    paths: ['g1_mid360_foxy_ws/**', '.github/workflows/g1-mid360-foxy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g1-mid360-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foxy:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    container: ros:foxy-ros-base-focal@sha256:34fbe32f5b1cd3eb25f6becaaa1d293bad754d64c31d96e638e4b30ed82f9f8e
    env:
      ROS_DOMAIN_ID: '87'
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      G1_NAV_TEST_ONLY: '1'
      G1_NAV_DEBUG_SLAM: '0'
      G1_NAV_LOAD_TEST: '1'
      G1_NAV_INTEGRATION_MODE: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'navigation' || 'navigation_dryrun' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Foxy test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gdb python3-pytest python3-yaml python3-colcon-common-extensions ros-foxy-rmw-cyclonedds-cpp ros-foxy-navigation2 ros-foxy-nav2-bringup ros-foxy-slam-toolbox ros-foxy-pointcloud-to-laserscan ros-foxy-diagnostic-msgs
      - name: Contract tests and colcon build on Python 3.8
        run: |
          source /opt/ros/foxy/setup.bash
          cd g1_mid360_foxy_ws
          mkdir -p logs
          python3 -m pytest tests/test_contracts.py tests/test_scripts.py tests/test_field_fixes.py tests/test_stage3.py -q --junitxml=logs/contracts.xml
          colcon list --base-paths src
          colcon build --base-paths src --executor sequential --event-handlers console_direct+
          source install/setup.bash
          for mode in sensor_check mapping localization navigation_dryrun navigation g1_nav_bringup; do
            ros2 launch g1_nav_bringup "$mode.launch.py" --show-args
          done
          python3 tests/ros_negative_launch.py
          dpkg-query -W 'ros-foxy-*' > logs/foxy-versions.txt
      - name: ROS sensor SLAM localization Nav2 fault-injection integration
        run: |
          source /opt/ros/foxy/setup.bash
          cd g1_mid360_foxy_ws
          source install/setup.bash
          python3 tests/ros_field_regression.py
          python3 tests/ros_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foxy-synthetic-evidence-${{ matrix.runner }}
          path: |
            g1_mid360_foxy_ws/logs/
            g1_mid360_foxy_ws/log/
